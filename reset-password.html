<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | VDOORA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <header class="site-header">
        <a href="index.html" class="logo">VDOORA<span>.</span></a>
        <a href="login.html" class="login-link">← Back to Login</a>
    </header>

    <main class="auth-container">
        <section class="auth-card">

            <a href="index.html" class="logo auth-logo">
                VDOORA<span>.</span>
            </a>

            <p class="eyebrow">SECURE YOUR ACCOUNT</p>
            <h1>Reset your password</h1>

            <p class="auth-description">
                Choose a new password for your VDOORA account.
            </p>

            <form action="login.html" method="get">

                <div class="form-group">
                    <label for="new-password">New password</label>
                    <input
                        type="password"
                        id="new-password"
                        name="new-password"
                        placeholder="Enter your new password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <small>Use at least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm new password</label>
                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Enter your password again"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary form-submit">
                    Reset Password
                </button>

            </form>

            <p class="auth-switch">
                Remember your password?
                <a href="login.html">Log in</a>
            </p>

        </section>
    </main>

    <footer class="auth-footer">
        <p>© 2026 VDOORA. Connect without limits.</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
