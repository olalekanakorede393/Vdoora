<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | VDOORA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="back-link" href="forgot-password.html">← Back</a>
    <h1 class="auth-logo">VDOORA</h1>
    <h2>Reset Your Password</h2>
    <p class="auth-description">Choose a new password.</p>

    <form class="auth-form">
      <label for="new-password">New Password</label>
      <input id="new-password" type="password"
        placeholder="Enter new password" required>

      <label for="new-password-confirm">Confirm New Password</label>
      <input id="new-password-confirm" type="password"
        placeholder="Enter new password again" required>

      <button class="primary-button" type="button"
        onclick="alert('Password resetting will be added later.')">
        Reset Password
      </button>
    </form>

    <p class="auth-switch"><a href="login.html">Return to Log In</a></p>
  </main>
</body>
</html>
