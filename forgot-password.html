<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | VDOORA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="back-link" href="login.html">← Back to Log In</a>
    <h1 class="auth-logo">VDOORA</h1>
    <h2>Forgot Password?</h2>
    <p class="auth-description">
      Enter your email address to begin resetting your password.
    </p>

    <form class="auth-form">
      <label for="reset-email">Email Address</label>
      <input id="reset-email" type="email"
        placeholder="Enter your email" required>

      <button class="primary-button" type="button"
        onclick="alert('Password recovery will be added later.')">
        Send Reset Link
      </button>
    </form>

    <p class="auth-switch">
      Remember your password? <a href="login.html">Log In</a>
    </p>
  </main>
</body>
</html>
