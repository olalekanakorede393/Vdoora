<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | VDOORA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <header class="site-header">
        <a href="index.html" class="logo">VDOORA<span>.</span></a>
        <a href="login.html" class="login-link">← Back to Login</a>
    </header>

    <main class="auth-container">
        <section class="auth-card">

            <a href="index.html" class="logo auth-logo">
                VDOORA<span>.</span>
            </a>

            <p class="eyebrow">ACCOUNT RECOVERY</p>
            <h1>Forgot your password?</h1>

            <p class="auth-description">
                Enter the email address associated with your account.
                We'll help you get back into VDOORA.
            </p>

            <form action="reset-password.html" method="get">

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary form-submit">
                    Continue
                </button>

            </form>

            <p class="auth-switch">
                Remember your password?
                <a href="login.html">Log in</a>
            </p>

        </section>
    </main>

    <footer class="auth-footer">
        <p>© 2026 VDOORA. Connect without limits.</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
