<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | VDOORA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <header class="site-header">
        <a href="index.html" class="logo">VDOORA<span>.</span></a>
        <a href="index.html" class="login-link">← Back to Home</a>
    </header>

    <main class="auth-container">
        <section class="auth-card">

            <a href="index.html" class="logo auth-logo">
                VDOORA<span>.</span>
            </a>

            <p class="eyebrow">WELCOME BACK</p>
            <h1>Log in to VDOORA</h1>
            <p class="auth-description">
                Your people are just a step away.
            </p>

            <form action="chat.html" method="get">

                <div class="form-group">
                    <label for="email">Email address or username</label>
                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Enter email or username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                    <a href="forgot-password.html" class="forgot-link">
                        Forgot password?
                    </a>
                </div>

                <label class="checkbox-row">
                    <input type="checkbox" name="remember" value="yes">
                    <span>Remember me on this device</span>
                </label>

                <button type="submit" class="btn btn-primary form-submit">
                    Log In
                </button>

            </form>

            <p class="auth-switch">
                New to VDOORA?
                <a href="signup.html">Create an account</a>
            </p>

        </section>
    </main>

    <footer class="auth-footer">
        <p>© 2026 VDOORA. Connect without limits.</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
